[package]
name = "guitar-studio-ai"
version = "0.1.0"
description = "Guitar Studio AI - 로컬 음악 분석 플레이어"
authors = ["Guitar Studio AI"]
edition = "2021"
license = "Proprietary"

[lib]
name = "guitar_studio_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
